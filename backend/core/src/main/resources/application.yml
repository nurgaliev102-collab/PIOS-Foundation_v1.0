spring:
  application:
    name: core
  datasource:
    # Core's own database — ADR-067 Write Boundary: the ONLY database Core
    # connects to. Never any Taxi module's database. No cross-database FK,
    # no shared table. Exactly one datasource url, and it is this one.
    url: jdbc:postgresql://127.0.0.1:5432/pios_core
    username: postgres
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/core
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

server:
  # ADR-067 Failure Isolation: Core's own port, not colliding with
  # 8081-8086 (the six Taxi contexts) or 8091 (ai-advisor).
  port: 8087

# A rolling log file in the shared backend/logs/ directory, mirroring every
# other module's own convention, so a future reader finds all module logs
# in one place once Core becomes a service.
logging:
  file:
    name: ../logs/core.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB

# ADR-044 (Owner Authentication): the one credential GET /v1/health/core
# checks. Deliberately left unset here -- an unset username/password-hash/
# password-salt makes OwnerCredentialGate.isConfigured() false, which
# denies every request rather than defaulting open. Each deployment must
# set all three explicitly, generated for that deployment
# (pios.owner.password-hash / pios.owner.password-salt are PBKDF2-HMAC-
# SHA256 output and its salt, both base64, never the plain password).
# pios:
#   owner:
#     username: ""
#     password-hash: ""
#     password-salt: ""
#     password-iterations: 210000
#     auth:
#       failure-delay-ms: 500
#       max-failures-per-window: 20
#       window-ms: 900000

# ADR-055 (Session Authentication) / ADR-067 Participant Reference: the
# shared HMAC secret identity's SessionTokenIssuer signs with and Core's
# SessionTokenVerifier checks against, used only to authorize
# GET /v1/core/participants/{participantReference}/history when the caller
# presents a Bearer token whose `sub` equals {participantReference}.
# Deliberately left unset here -- an unset pios.session.secret makes every
# SessionTokenVerifier.verify() return null, so that endpoint responds 401,
# the same fail-closed posture pios.owner.* establishes above. Must be set
# to the exact same value identity's own pios.session.secret carries --
# Core has no build-time dependency on identity and never calls it;
# verification is entirely local (ADR-055 Decision 1).
# pios:
#   session:
#     secret: ""
