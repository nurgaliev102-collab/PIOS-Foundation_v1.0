spring:
  application:
    name: driver-management
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pios_driver_management
    username: postgres
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/drivermanagement
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated

server:
  port: 8081

# T-1 (ENGINEERING_EXECUTION_PLAN_SPRINT_1_PLATFORM_OPERATIONS_MVP.md): a
# rolling log file, so one exists before this module becomes a Windows
# service (ADR-049 Decision 5 -- once that happens, the bootRun console
# disappears entirely, not just becomes inconvenient, and this file is all
# that is left). Shared directory: `backend/logs/`, one level above every
# module's own working directory, so a future reader (ADR-050's tier-3
# endpoint, or a human) finds all five logs in one place. Retention is O-8's
# own recommendation, not yet a separately ratified number.
logging:
  file:
    name: ../logs/driver-management.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB

# Implementation Plan: Production Outbox Relay Trigger v1.0. Interval, in
# milliseconds, between the end of one OutboxRelayScheduler tick and the
# start of the next -- a configuration default, not a product invariant.
pios:
  outbox:
    relay:
      fixed-delay-ms: 2000
  # ADR-044 (Owner Authentication): the one credential `GET /v1/health`
  # checks. Deliberately left unset here -- an unset username/password-hash/
  # password-salt makes OwnerCredentialGate.isConfigured() false, which
  # denies every request rather than defaulting open. Each deployment must
  # set all three explicitly, generated for that deployment
  # (`pios.owner.password-hash`/`pios.owner.password-salt` are PBKDF2-HMAC-
  # SHA256 output and its salt, both base64, never the plain password).
  # owner:
  #   username: ""
  #   password-hash: ""
  #   password-salt: ""
  #   password-iterations: 210000
  #   auth:
  #     failure-delay-ms: 500
  #     max-failures-per-window: 20
  #     window-ms: 900000
  # Task 25 (Orders Cancellation & Driver Availability Security
  # Remediation), extending ADR-055 (Session Authentication and Password
  # Credential): the shared HMAC secret this module's own new
  # SessionTokenVerifier checks a session token against, used only by
  # POST /v1/drivers/{id}/availability. Deliberately left unset here -- an
  # unset pios.session.secret makes SessionTokenVerifier.verify() return
  # null for every token, so that endpoint responds 401, the same
  # fail-closed posture pios.owner.* already establishes above. Must be
  # set to the exact same value `identity`'s own pios.session.secret
  # carries -- this module has no build-time dependency on identity and
  # never calls it; verification is entirely local (ADR-055 Decision 1).
  # session:
  #   secret: ""
  # ADR-079 (Test-Data Credential for Synthetic (isTest) Driver Creation):
  # the one credential a scriptable, non-owner caller may present, via the
  # `PiosTest <token>` Authorization scheme, to create a synthetic
  # (isTest = true) driver row on POST /v1/drivers. Deliberately left unset
  # here -- an unset pios.test-data.credential-hash makes
  # TestDataCredentialGate.isConfigured() false, which denies every request
  # (401) rather than defaulting open, the same fail-closed posture
  # pios.owner.* already establishes above. credential-hash is
  # base64(SHA-256(token)); token is a >=256-bit value from a CSPRNG, never
  # the plain token itself (ADR-079 Decision 3 -- SHA-256, not PBKDF2: this
  # credential is machine-generated, not human-chosen, so PBKDF2's
  # iteration cost buys nothing here).
  # test-data:
  #   credential-hash: ""
  #   auth:
  #     failure-delay-ms: 500
  #     max-failures-per-window: 20
  #     window-ms: 900000
