spring:
  application:
    name: passenger-experience
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pios_passenger_experience
    username: postgres
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/passengerexperience

server:
  port: 8082

# T-1 (ENGINEERING_EXECUTION_PLAN_SPRINT_1_PLATFORM_OPERATIONS_MVP.md): a
# rolling log file, so one exists before this module becomes a Windows
# service (ADR-049 Decision 5 -- once that happens, the bootRun console
# disappears entirely, not just becomes inconvenient, and this file is all
# that is left). Shared directory: `backend/logs/`, one level above every
# module's own working directory, so a future reader (ADR-050's tier-3
# endpoint, or a human) finds all five logs in one place. Retention is O-8's
# own recommendation, not yet a separately ratified number.
logging:
  file:
    name: ../logs/passenger-experience.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB

# Tranche 2: Passenger Experience REST Transport. Order Management's own
# Submit Order REST endpoint (server.port in order-management's own
# application.yml).
pios:
  order-management:
    base-url: http://127.0.0.1:8083
  # ADR-044 (Owner Authentication): the one credential `GET /v1/health`
  # checks. Deliberately left unset here -- an unset username/password-hash/
  # password-salt makes OwnerCredentialGate.isConfigured() false, which
  # denies every request rather than defaulting open. Each deployment must
  # set all three explicitly, generated for that deployment
  # (`pios.owner.password-hash`/`pios.owner.password-salt` are PBKDF2-HMAC-
  # SHA256 output and its salt, both base64, never the plain password).
  # owner:
  #   username: ""
  #   password-hash: ""
  #   password-salt: ""
  #   password-iterations: 210000
  #   auth:
  #     failure-delay-ms: 500
  #     max-failures-per-window: 20
  #     window-ms: 900000
  # ADR-055 (Session Authentication and Password Credential): the shared
  # HMAC secret this module's SessionTokenVerifier checks a session token
  # against. Deliberately left unset here -- an unset pios.session.secret
  # makes SessionTokenVerifier.verify() return null for every token, so
  # every Circle-of-Trust endpoint responds 401, the same fail-closed
  # posture pios.owner.* already establishes above. Must be set to the
  # exact same value `identity`'s own pios.session.secret carries -- this
  # module has no build-time dependency on identity and never calls it;
  # verification is entirely local (ADR-055 Decision 1).
  # session:
  #   secret: ""
