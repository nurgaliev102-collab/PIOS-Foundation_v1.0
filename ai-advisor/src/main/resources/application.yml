spring:
  application:
    name: ai-advisor

server:
  port: 8091
  # Explicit, not the implicit default -- same deliberate statement
  # platform-ops/src/main/resources/application.yml already makes for the
  # same reason (phone/LAN reachability; never assume "localhost" resolves
  # usefully on this machine).
  address: 0.0.0.0

logging:
  file:
    name: ../logs/ai-advisor.log
  logback:
    rollingpolicy:
      max-file-size: 20MB

# ADR-056 Decision 4: the SAME owner credential every domain module's own
# OwnerCredentialGate already checks (pios.owner.* in each PIOS module) --
# not a new, independent secret. Deliberately left unset here -- an unset
# username/password-hash/password-salt makes OwnerCredentialGate.isConfigured()
# false, which denies every request rather than defaulting open, exactly the
# precedent ADR-044/OwnerCredentialGate already established. Each deployment
# must set all three explicitly, generated for that deployment
# (pios.owner.password-hash/password-salt are PBKDF2-HMAC-SHA256 output and
# its salt, both base64, never the plain password) -- the same values
# already configured for the five domain modules, copied here unchanged.
# pios:
#   owner:
#     username: ""
#     password-hash: ""
#     password-salt: ""
#     password-iterations: 210000
#     auth:
#       failure-delay-ms: 500
#       max-failures-per-window: 20
#       window-ms: 900000
#   ai-advisor:
#     max-request-body-bytes: 8192
#     rate-limit:
#       min-interval-ms: 10000
#     budget:
#       max-calls-per-day: 200
#       max-calls-per-month: 2000

# ADR-056 Rollout Step 3 (DeepSeekProvider) / PIOS Intelligence first local
# step (OllamaProvider) / PIOS Intelligence real hosted Qwen step
# (QwenProvider). "provider" selects which AIProvider bean is active
# (Spring @ConditionalOnProperty) -- deliberately defaulting to "mock" so the
# existing pilot never depends on a funded DeepSeek/Qwen account, or on
# Ollama being installed, existing. Set to "deepseek" only once
# pios.ai-advisor.deepseek.api-key is configured for real; a blank key with
# provider=deepseek fails every analysis closed (outcome:
# "provider_unavailable"), never a crash and never a fabricated answer. Set
# to "ollama" once a local Ollama instance is actually running and reachable
# at pios.ai-advisor.ollama.base-url -- unlike DeepSeek, a blank
# pios.ai-advisor.ollama.api-key is the *normal*, expected case (Ollama has
# no built-in credential of its own) and does not fail closed by itself; a
# request still fails with "provider_unavailable" if Ollama is simply not
# running at that address. Set to "qwen" only once
# pios.ai-advisor.qwen.api-key is configured for real (DashScope, a paid
# cloud API like DeepSeek, not a local server like Ollama) -- a blank key
# with provider=qwen fails every analysis closed the same way DeepSeek does.
# The key itself is never hardcoded here: set it via the environment
# variable PIOS_AI_ADVISOR_QWEN_API_KEY (Spring Boot's own relaxed
# environment-variable binding for pios.ai-advisor.qwen.api-key), the same
# mechanism already available for pios.ai-advisor.deepseek.api-key.
# pios.ai-advisor.qwen.base-url defaults to the DashScope INTERNATIONAL
# endpoint (dashscope-intl.aliyuncs.com), not the mainland-China one and not
# a workspace-specific endpoint -- this deployment's own API key lives in
# DashScope's Singapore region, and a real API test from this machine
# against a workspace-specific endpoint returned
# "403 Workspace endpoint access denied"; -intl is the endpoint actually
# confirmed working for this key (2026-08-17).
pios:
  ai-advisor:
    # provider: mock
    deepseek:
      # base-url: https://api.deepseek.com
      # model: deepseek-v4-flash
      # timeout-ms: 30000
      # api-key: ""
    ollama:
      # base-url: http://localhost:11434
      # model: qwen2.5
      # timeout-ms: 30000
      # api-key: ""
    qwen:
      # base-url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      # model: qwen-plus
      # timeout-ms: 30000
      # api-key: ""
